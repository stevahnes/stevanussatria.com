version: 2

updates:
  # ─────────────────────────────────────────────
  # Frontend / VitePress
  # ─────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly

    # Keep routine dependency PRs under control.
    # Security updates are not constrained by this limit.
    open-pull-requests-limit: 3

    versioning-strategy: increase-if-necessary

    groups:
      # Routine minor + patch updates → one PR
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

      # Security updates → grouped separately
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

    # Don't automatically take major-version upgrades.
    # Security updates are still created even when this is ignored.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # ─────────────────────────────────────────────
  # API / Next.js
  # ─────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly

    open-pull-requests-limit: 3

    versioning-strategy: increase-if-necessary

    groups:
      # Routine minor + patch updates → one PR
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

      # Security updates → grouped separately
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # ─────────────────────────────────────────────
  # GitHub Actions
  # ─────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

    open-pull-requests-limit: 3

    groups:
      # Routine action updates → one PR
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

      # Security updates → grouped separately
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
